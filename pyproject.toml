[project]
name = "volunteering-web-app"
version = "0.1.0"
description = "A Modern Volunteering Web App"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17.2",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "cryptography>=46.0.3",
    "email-validator>=2.3.0",
    "fastapi>=0.121.3",
    "granian>=2.6.0",
    "greenlet>=3.2.4",
    "jinja2>=3.1.6",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.148.2",
    "anyio>=4.11.0",
    "pytest-asyncio>=1.3.0",
    "aiosqlite>=0.21.0",
    "pytest>=9.0.1",
    "mypy>=1.18.2",
    "types-python-jose>=3.5.0.20250531",
    "ruff>=0.14.5",
    "httpx>=0.28.1"
]

[tool.pytest.ini_options]
testpaths = [
  "app/tests/",
]
addopts = "-p no:cacheprovider --import-mode=importlib"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
pydocstyle = { convention = "google" }
ignore = ["SLF001", "S101", "E501", "COM812", "ISC001", "FBT001", "F403"]
select = ["ALL"]
extend-select = ["ALL"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*.py" = ["S101", "S105", "D102", "D105", "ARG002", "PLR0913", "PLR0915", "ANN401", "TC002", "TC003"]
"app/core/startup.py" = ["TRY400"]
"app/auth/router.py" = ["PLR0913"]

[tool.ruff.format]
docstring-code-format = true