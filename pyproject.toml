[project]
name = "volunteering-web-app"
version = "0.1.0"
description = "A Modern Volunteering Web App"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
  "alembic>=1.17.2",
  "argon2-cffi>=25.1.0",
  "email-validator>=2.3.0",
  "faker>=39.0.0",
  "fastapi>=0.125.0",
  "granian>=2.6.0",
  "greenlet>=3.3.0",
  "jinja2>=3.1.6",
  "psycopg[binary,pool]>=3.3.2",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.12.0",
  "python-dotenv>=1.2.1",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.21",
  "sqlalchemy[asyncio]>=2.0.45",
  "pillow>=12.0.0",
  "types-requests>=2.32.4.20250913",
  "psutil>=7.1.3",
  "colorama>=0.4.6",
  "types-psutil>=7.1.3.20251211",
  "pynacl>=1.6.1",
]

[project.optional-dependencies]
dev = [
  "polyfactory>=3.1.0",
  "pytest-cases>=3.9.1",
  "anyio>=4.12.0",
  "pytest-asyncio>=1.3.0",
  "aiosqlite>=0.21.0",
  "pytest>=9.0.2",
  "mypy>=1.19.1",
  "types-python-jose>=3.5.0.20250531",
  "ruff>=0.14.9",
  "httpx>=0.28.1",
  "pyfakefs>=5.10.2",
  "schemathesis>=4.7.6",
  "djlint>=1.36.4",
]

[tool.pytest.ini_options]
testpaths = ["tests/"]
pythonpath = ["."]
addopts = "-p no:cacheprovider --import-mode=importlib"

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
pydocstyle = { convention = "google" }
ignore = [
  "TC001",
  "TC002",
  "TC003",
  "PLR0913",
  "SLF001",
  "S101",
  "E501",
  "COM812",
  "ISC001",
  "FBT001",
  "F403",
]
select = ["ALL"]
extend-select = ["ALL"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"*" = [
  "TC001",
  "TC002",
  "TC003",
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0915",
  "PLR0913",
  "SLF001",
  "S101",
  "E501",
  "COM812",
  "ISC001",
  "FBT001",
  "F403",
]
"tests/*.py" = [
  "PLC0415",
  "PLR2004",
  "S101",
  "S105",
  "D102",
  "D105",
  "ARG002",
  "PLR0913",
  "PLR0915",
  "ANN401",
  "TC002",
  "TC003",
]
"app/core/startup.py" = ["TRY400"]
"app/auth/router.py" = ["PLR0913"]
"app/auth/schemas.py" = ["S105"]

[tool.ruff.format]
docstring-code-format = true
