name: Setup and Test Web App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_DB_PASSWORD }}
          POSTGRES_DB: volunteeringapp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_DB_PASSWORD }}
      POSTGRES_DB: volunteeringapp
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      SECRET_KEY: ${{ secrets.APP_TEST_KEY }}
      JWT_ALGORITHM: HS256
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Initialize PostgreSQL extensions
        run: |
          PGPASSWORD=${{ secrets.POSTGRES_TEST_DB_PASSWORD }} psql -h localhost -U user -d volunteeringapp -f Docker/init-postgres-extensions.sql

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linting (ruff check)
        run: uv run ruff check

      - name: Run type checking (mypy)
        run: uv run mypy --strict .

      - name: Run tests (pytest)
        run: uv run pytest -xvs

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Start Application Server
        run: |
          uv run python run.py &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

      - name: Wait for server to be ready
        run: |
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -s http://localhost:8000/openapi.json > /dev/null; then
              echo "Server is ready!"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "Waiting for server... (attempt $attempt/$max_attempts)"
            sleep 1
          done
          echo "Server failed to start within timeout"
          exit 1

      - name: Run Schemathesis tests
        run: uv run schemathesis run http://localhost:8000/openapi.json

      - name: Cleanup - Stop API server
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
            wait $SERVER_PID 2>/dev/null || true
          fi
