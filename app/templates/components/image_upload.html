{% from "components/icons.html" import icon %}
{% macro image_upload_modal(id, title, endpoint, aspect_ratio=1) %}
    <script>
        if (!window._imageUploaderRegistered) {
            window._imageUploaderRegistered = true;
            document.addEventListener('alpine:init', () => {
                Alpine.data('imageUploader', ({
                    endpointUrl,
                    uploadName = 'file',
                    aspectRatio = 1
                }) => ({
                    uploading: false,
                    file: null,
                    dragOver: false,
                    error: null,
                    cropperOpen: false,
                    cropImage: null,
                    scale: 1,
                    minScale: 0.1,
                    coverScale: 1,
                    maxScale: 3,
                    imageX: 0,
                    imageY: 0,
                    isDragging: false,
                    startX: 0,
                    startY: 0,
                    initialImageX: 0,
                    initialImageY: 0,

                    triggerSelect() {
                        this.$refs.fileInput.click();
                    },

                    onZoomChange(event) {
                        const value = parseFloat(event.target.value);
                        if (!Number.isFinite(value)) return;
                        // Clamp zoom into configured range so slider and image stay in sync
                        this.scale = Math.min(this.maxScale, Math.max(this.minScale, value));
                    },

                    // Calculate the minimum scale needed for the image to fully cover the crop area
                    calculateCoverScale(imgWidth, imgHeight) {
                        // Viewport dimensions (the visible crop area in the UI)
                        const viewportWidth = aspectRatio === 1 ? 250 : 320;
                        const viewportHeight = aspectRatio === 1 ? 250 : 180;

                        // Scale needed to cover in each dimension
                        const scaleX = viewportWidth / imgWidth;
                        const scaleY = viewportHeight / imgHeight;

                        // Use the larger scale to ensure full coverage
                        return Math.max(scaleX, scaleY);
                    },

                    handleFile(event) {
                        const file = event.target.files?.[0] || event.dataTransfer?.files?.[0];
                        if (!file) return;

                        if (!file.type.startsWith('image/')) {
                            this.error = 'Please upload an image file';
                            return;
                        }

                        if (file.size > 5 * 1024 * 1024) {
                            this.error = 'Image must be smaller than 5MB';
                            return;
                        }

                        this.error = null;
                        this.file = file;

                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const img = new Image();
                            img.onload = () => {
                                this.cropImage = img;

                                this.coverScale = this.calculateCoverScale(img.width, img.height);
                                this.minScale = this.coverScale * 0.5;
                                this.maxScale = Math.max(3, this.coverScale * 3);
                                this.scale = this.coverScale;

                                this.cropperOpen = true;
                                this.resetCrop();
                            };
                            img.src = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    },

                    resetCrop() {
                        this.scale = this.coverScale;
                        this.imageX = 0;
                        this.imageY = 0;
                    },

                    startDrag(e) {
                        this.isDragging = true;
                        this.startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                        this.startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                        this.initialImageX = this.imageX;
                        this.initialImageY = this.imageY;
                    },

                    onDrag(e) {
                        if (!this.isDragging) return;
                        e.preventDefault();
                        const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                        const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                        this.imageX = this.initialImageX + (clientX - this.startX);
                        this.imageY = this.initialImageY + (clientY - this.startY);
                    },

                    stopDrag() {
                        this.isDragging = false;
                    },

                    async upload() {
                        if (!this.cropImage) return;

                        this.uploading = true;

                        try {
                            const blob = await this.getCroppedBlob();
                            const formData = new FormData();
                            formData.append(uploadName, blob, 'upload.webp');

                            // Get CSRF token from cookie for header-based validation
                            // This prevents the middleware from consuming the request body
                            const csrfToken = document.cookie
                                .split('; ')
                                .find(row => row.startsWith('csrf_token='))
                                ?.split('=')[1];

                            const response = await fetch(endpointUrl, {
                                method: 'POST',
                                body: formData,
                                headers: {
                                    'X-Requested-With': 'XMLHttpRequest',
                                    'X-CSRF-Token': csrfToken || ''
                                }
                            });

                            if (response.ok) {
                                window.location.reload();
                            } else {
                                const data = await response.json().catch(() => ({}));
                                this.error = data.detail || 'Upload failed';
                            }
                        } catch (err) {
                            console.error(err);
                            this.error = 'Something went wrong';
                        } finally {
                            this.uploading = false;
                            this.cropperOpen = false;
                        }
                    },

                    getCroppedBlob() {
                        return new Promise((resolve) => {
                            const canvas = document.createElement('canvas');
                            const targetWidth = aspectRatio === 1 ? 512 : 1280;
                            const targetHeight = targetWidth / aspectRatio;

                            canvas.width = targetWidth;
                            canvas.height = targetHeight;

                            const ctx = canvas.getContext('2d');
                            ctx.clearRect(0, 0, canvas.width, canvas.height);

                            // For circular crops (aspect_ratio === 1)
                            if (aspectRatio === 1) {
                                // The visible crop area in the viewport is 250x250px circle
                                // We need to map this to the canvas (512x512)
                                const viewportCropSize = 250;
                                const canvasCropSize = 512;
                                const scale = canvasCropSize / viewportCropSize;

                                // Calculate where to draw the image on the canvas
                                // The image is centered and scaled
                                const centerX = canvas.width / 2;
                                const centerY = canvas.height / 2;

                                const drawnW = this.cropImage.width * this.scale * scale;
                                const drawnH = this.cropImage.height * this.scale * scale;

                                const destX = centerX + (this.imageX * scale) - (drawnW / 2);
                                const destY = centerY + (this.imageY * scale) - (drawnH / 2);

                                // Draw the image
                                ctx.drawImage(this.cropImage, 0, 0, this.cropImage.width, this.cropImage.height, destX, destY, drawnW, drawnH);

                                // Create circular mask
                                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                                const data = imageData.data;
                                const radius = canvas.width / 2;
                                const centerCanvasX = canvas.width / 2;
                                const centerCanvasY = canvas.height / 2;

                                for (let i = 0; i < data.length; i += 4) {
                                    const pixelIndex = i / 4;
                                    const x = pixelIndex % canvas.width;
                                    const y = Math.floor(pixelIndex / canvas.width);

                                    const dx = x - centerCanvasX;
                                    const dy = y - centerCanvasY;
                                    const distance = Math.sqrt(dx * dx + dy * dy);

                                    if (distance > radius) {
                                        data[i + 3] = 0; // Set alpha to 0 (transparent)
                                    }
                                }

                                ctx.putImageData(imageData, 0, 0);
                            } else {
                                // For non-circular crops (banners, etc.)
                                const viewportCropSize = 320;
                                const canvasCropSize = 1280;
                                const scale = canvasCropSize / viewportCropSize;

                                const centerX = canvas.width / 2;
                                const centerY = canvas.height / 2;

                                const drawnW = this.cropImage.width * this.scale * scale;
                                const drawnH = this.cropImage.height * this.scale * scale;

                                const destX = centerX + (this.imageX * scale) - (drawnW / 2);
                                const destY = centerY + (this.imageY * scale) - (drawnH / 2);

                                ctx.drawImage(this.cropImage, 0, 0, this.cropImage.width, this.cropImage.height, destX, destY, drawnW, drawnH);
                            }

                            canvas.toBlob(resolve, 'image/webp', 0.9);
                        });
                    }
                }));
            });
        }
    </script>
    <div x-data="imageUploader({ endpointUrl: '{{ endpoint }}', aspectRatio: {{ aspect_ratio }} })">
        <input type="file"
               x-ref="fileInput"
               accept="image/*"
               class="hidden"
               @change="handleFile($event)">
        <template x-teleport="body">
            <div x-show="cropperOpen"
                 x-cloak
                 class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]"
                     @click.outside="cropperOpen = false">
                    <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                        <h3 class="font-bold text-slate-800">{{ title }}</h3>
                        <button @click="cropperOpen = false"
                                class="text-slate-400 hover:text-slate-600">{{ icon('x', 'lg') }}</button>
                    </div>
                    <!-- Crop Area -->
                    <div class="relative bg-slate-900 overflow-hidden flex-1 min-h-[300px] cursor-move select-none"
                         @mousedown="startDrag"
                         @mousemove="onDrag"
                         @mouseup="stopDrag"
                         @mouseleave="stopDrag"
                         @touchstart="startDrag"
                         @touchmove="onDrag"
                         @touchend="stopDrag">
                        <!-- Image Layer -->
                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                            <img :src="cropImage && cropImage.src"
                                 :style="`transform: translate(${imageX}px, ${imageY}px) scale(${scale});`"
                                 class="max-w-none transition-transform duration-75 origin-center"
                                 draggable="false">
                        </div>
                        <div class="absolute inset-0 pointer-events-none bg-black/50">
                            <!-- The transparent hole -->
                            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 border-2 border-white/50 shadow-[0_0_0_9999px_rgba(0,0,0,0.5)]"
                                 :style="`width: {{ 250 if aspect_ratio == 1 else 320 }}px; height: {{ 250 if aspect_ratio == 1 else 180 }}px; border-radius: {{ '50%' if aspect_ratio == 1 else '12px' }}`">
                            </div>
                        </div>
                    </div>
                    <!-- Controls -->
                    <div class="p-4 bg-white border-t border-slate-100">
                        <div class="mb-4">
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Zoom</label>
                            <input type="range"
                                   :min="minScale"
                                   :max="maxScale"
                                   step="0.05"
                                   :value="scale"
                                   @input="onZoomChange"
                                   class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-brand-600">
                        </div>
                        <div class="flex gap-3">
                            <button @click="cropperOpen = false"
                                    class="flex-1 px-4 py-2 border border-slate-200 rounded-xl font-bold text-slate-600 hover:bg-slate-50">
                                Cancel
                            </button>
                            <button @click="upload()"
                                    :disabled="uploading"
                                    class="flex-1 px-4 py-2 bg-brand-600 text-white rounded-xl font-bold hover:bg-brand-700 disabled:opacity-50 flex items-center justify-center gap-2">
                                <span x-show="uploading"
                                      class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
                                <span x-text="uploading ? 'Uploading...' : 'Save Image'"></span>
                            </button>
                        </div>
                        <p x-show="error"
                           x-text="error"
                           class="text-red-500 text-sm font-medium mt-3 text-center"></p>
                    </div>
                </div>
            </div>
        </template>
        <!-- Caller provides the trigger button/UI -->
        {{ caller() }}
    </div>
{% endmacro %}
