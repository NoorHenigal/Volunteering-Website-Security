{% macro render_auth_form(title, action, button_text, extra_fields="", footer_text="", footer_link="", footer_link_text="") %}
<div class="max-w-md mx-auto">
    <div class="bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-3xl font-bold mb-6 text-center text-black">{{ title }}</h2>

        {% include "components/alert.html" %}

        <form method="POST" action="{{ action }}" class="space-y-6">
            <div>
                <label class="block text-black font-semibold mb-2">Email</label>
                <input type="email" name="email" required
                       class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-600">
            </div>
            <div>
                <label class="block text-black font-semibold mb-2">Password</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-600">
            </div>
            {{ extra_fields | safe }}
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">
                {{ button_text }}
            </button>
        </form>
        {% if footer_text %}
        <p class="mt-6 text-center text-gray-600">
            {{ footer_text }} <a href="{{ footer_link }}" class="text-blue-600 font-semibold hover:text-blue-800">{{ footer_link_text }}</a>
        </p>
        {% endif %}
    </div>
</div>
{% endmacro %}
