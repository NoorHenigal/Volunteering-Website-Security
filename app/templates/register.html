{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-3xl font-bold mb-6 text-center text-black">Register</h2>
        
        <!-- Show error message if exists -->
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="/register" class="space-y-6">
            <div>
                <label class="block text-black font-semibold mb-2">Full Name</label>
                <input type="text" name="name" required 
                       class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-600">
            </div>
            <div>
                <label class="block text-black font-semibold mb-2">Email</label>
                <input type="email" name="email" required 
                       class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-600">
            </div>
            <div>
                <label class="block text-black font-semibold mb-2">Password</label>
                <input type="password" name="password" required 
                       class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-600">
            </div>
            <div>
                <label class="block text-black font-semibold mb-2">Confirm Password</label>
                <input type="password" name="confirm_password" required 
                       class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-600">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">
                Register
            </button>
        </form>
        <p class="mt-6 text-center text-gray-600">
            Already have an account? <a href="/login" class="text-blue-600 font-semibold hover:text-blue-800">Login</a>
        </p>
    </div>
</div>
{% endblock %}
