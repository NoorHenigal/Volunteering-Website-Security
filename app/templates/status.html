{% extends "base.html" %}

{% block title %}Status{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white p-8 rounded-lg shadow-lg">
        {% if user %}
            <h2 class="text-3xl font-bold mb-6 text-center text-black">You are logged in</h2>
            <div class="mb-6">
                <p class="text-gray-700 mb-2"><span class="font-semibold">Email:</span> {{ user.email }}</p>
                <p class="text-gray-700 mb-2"><span class="font-semibold">Role:</span> {{ user.role }}</p>
            </div>
            <a href="/auth/logout" class="block w-full text-center bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-lg">
                Log out
            </a>
        {% else %}
            <h2 class="text-3xl font-bold mb-6 text-center text-black">You are not logged in</h2>
            <a href="/auth/login" class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg">
                Log in
            </a>
        {% endif %}
    </div>
</div>
{% endblock %}
