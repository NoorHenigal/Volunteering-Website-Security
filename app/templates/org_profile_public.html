{% extends "base.html" %}

{% block title %}{{ organization.name }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-8 px-4">
    <div class="bg-white shadow rounded-lg overflow-hidden">
        <div class="p-6 sm:p-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">{{ organization.name }}</h1>
            {% if organization.description %}
            <p class="text-lg text-gray-600 mb-6">{{ organization.description }}</p>
            {% endif %}

            <div class="mt-8 border-t border-gray-200 pt-6">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">About</h2>
                <p class="text-gray-600">
                    Organization since {{ organization.created_at.strftime('%B %Y') }}
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
