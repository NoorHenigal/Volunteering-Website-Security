<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Volunteering App{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold">Volunteering Platform</h1>
                <ul class="flex space-x-6">
                    <li><a href="/" class="hover:text-black">Home</a></li>
                    <li><a href="/login" class="hover:text-black">Login</a></li>
                    <li><a href="/register" class="hover:text-black">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-white text-center py-4 mt-12">
        <p>&copy; 2025 Volunteering Platform</p>
    </footer>
</body>
</html>
